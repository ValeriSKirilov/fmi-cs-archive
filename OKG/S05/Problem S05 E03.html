<html>
<head>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
        }
    </style>
    <script type="importmap">
        { "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "csg/": "https://cdn.jsdelivr.net/gh/looeee/threejs-csg@main/src/CSG/"
        } }
    </script>
</head>
<body>
<script type="module">

    import * as THREE from "three";
    import {CSG} from "csg/CSG.js";


    // Задача: конструирайте порцеланова чаша със
    // загладени ръбове.


    var renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setAnimationLoop(drawFrame);
    document.body.appendChild(renderer.domElement);

    var scene = new THREE.Scene();
    scene.background = new THREE.Color('pink');

    var aspect = window.innerWidth / window.innerHeight;
    var camera = new THREE.PerspectiveCamera(30, aspect);
    camera.position.set(0, 0, 10);
    camera.lookAt(new THREE.Vector3());


    // начален стадий на чаша
    let material = new THREE.MeshPhongMaterial({
        color: 'purple',
        shininess: 100,
        specular: 'white'
    });
    let mug = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 2.5, 80), material);

    let mugInside = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 3.0, 80), material);
    mugInside.position.y = 0.3;

    let csg = new CSG();
    csg.subtract([mug, mugInside]);

    let mugFinal = csg.toMesh();
    mugFinal.material = material;

    let mugHandle = new THREE.Mesh(new THREE.TorusGeometry(0.9, 0.2, 10, 100, Math.PI), material);
    mugHandle.position.x = 1;
    mugHandle.rotation.z = -Math.PI / 2;

    var edge = new THREE.Mesh(new THREE.TorusGeometry(1, 0.1, 20, 80), material);
    edge.position.y = 1.25;
    edge.rotation.x = Math.PI / 2;
    mugFinal.add(edge);

    var bottomEdge = edge.clone();
    bottomEdge.position.y = -1.25;
    mugFinal.add( bottomEdge );

    var bottom = new THREE.Mesh( new THREE.CylinderGeometry( 1, 1, 0.2, 80 ), material );
    bottom.position.y = -1.25;
    mugFinal.add( bottom );

    mugFinal.add(mugHandle);

    scene.add(mugFinal);

    var light = new THREE.PointLight('white', 150);
    light.position.set(0, 5, 10);
    scene.add(light);


    function drawFrame(t) {
        // въртим чашата
        mugFinal.rotation.x = t / 1000;
        mugFinal.rotation.z = Math.sin(2 * mugFinal.rotation.x) / 2;
        mugFinal.rotation.y = t / 1300;

        renderer.render(scene, camera);
    }

</script>
</body>
</html>
