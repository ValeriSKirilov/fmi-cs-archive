    function tiresRender() {
        function visualizeTire(x, y, z, mirrored) {
            var tire = new THREE.Group();

            var geometry = new THREE.SphereGeometry(0.4, 32, 32, 0, 6.3, 2.7, 0.45);
            var material = new THREE.MeshStandardMaterial({
                color: 0x261C13,
                roughness: 0.1,
                metalness: 0.2,
                side: THREE.DoubleSide
            });
            var middleCircle = new THREE.Mesh(geometry, material);
            middleCircle.position.set(x + 0.35 + mirrored * -0.46, y, z);
            if (mirrored) {
                middleCircle.rotation.z = Math.PI / 2;
            } else {
                middleCircle.rotation.z = -Math.PI / 2;
            }
            tire.add(middleCircle);

            for (var i = 0; i < 6; i++) {
                var geometry = new THREE.CylinderGeometry(0.02, 0.02, 0.5, 32, 32);
                var material = new THREE.MeshStandardMaterial({
                    color: 0x261C13,
                    roughness: 0.1,
                    metalness: 0.2,
                    side: THREE.DoubleSide
                });
                var innerConnections = new THREE.Mesh(geometry, material);
                innerConnections.position.set(x + mirrored * 0.24, y, z);
                innerConnections.rotation.x = i * 0.5;
                tire.add(innerConnections);
            }

            var geometry = new THREE.TorusGeometry(0.27, 0.08, 30, 200);
            var material = new THREE.MeshStandardMaterial({
                color: 0x261C13,
                roughness: 0.1,
                metalness: 0.2,
            });
            var innerTireCircle = new THREE.Mesh(geometry, material);
            innerTireCircle.position.set(x + mirrored * 0.25, y, z);
            innerTireCircle.rotation.y = Math.PI / 2;
            tire.add(innerTireCircle);

            var geometry = new THREE.SphereGeometry(0.45, 64, 32, 0, 6.3, 1.5, 0.6);
            var material = new THREE.MeshStandardMaterial({
                color: 0x261C13,
                roughness: 0.1,
                metalness: 0.2,
                side: THREE.DoubleSide
            });
            var outerTireCircleRight = new THREE.Mesh(geometry, material);
            outerTireCircleRight.position.set(x + 0.13, y, z);
            outerTireCircleRight.rotation.z = Math.PI / 2;
            tire.add(outerTireCircleRight);

            var geometry = new THREE.SphereGeometry(0.45, 64, 32, 6.3, 6.3, 1.5, 0.6);
            var material = new THREE.MeshStandardMaterial({
                color: 0x261C13,
                roughness: 0.1,
                metalness: 0.2,
                side: THREE.DoubleSide
            });
            var outerTireCircleLeft = new THREE.Mesh(geometry, material);
            outerTireCircleLeft.position.set(x + 0.13, y, z);
            outerTireCircleLeft.rotation.z = Math.PI / 2;
            outerTireCircleLeft.rotation.y = Math.PI;
            tire.add(outerTireCircleLeft);

            scene.add(tire);
        }

        //visualizeTire for loops
        {
            for (var i = 0; i < 2; i++) {
                visualizeTire(-2.3 + i * 4.35, -1, -1.95, i);
            }

            for (var i = 0; i < 2; i++) {
                visualizeTire(-2.3 + i * 4.35, -1, -0.55, i);
            }

            for (var i = 0; i < 2; i++) {
                visualizeTire(-2.3 + i * 4.35, -1, 2.45, i);
            }
        }

        function tiresConnectionsRender() {
            var tiresConnections = new THREE.Group();

            function connectingCylsRender(x, y, z) {
                var geometry = new THREE.CylinderGeometry(0.15, 0.15, 3.4, 64, 64);
                var material = new THREE.MeshStandardMaterial({
                    color: 0x59462B,
                    side: THREE.DoubleSide,
                    metalness: 0.8,
                    roughness: 0.5
                });
                var connectingCylinderInner = new THREE.Mesh(geometry, material);
                connectingCylinderInner.position.set(x, y, z);
                connectingCylinderInner.rotation.z = Math.PI / 2;
                tiresConnections.add(connectingCylinderInner);

    function move() {
        let isDragging = false;
        let previousMousePosition = {x: 0, y: 0};
        const rotationSpeed = 0.005;

        // Mouse events
        renderer.domElement.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = {x: e.clientX, y: e.clientY};
        });

        renderer.domElement.addEventListener('mouseup', () => {
            isDragging = false;
        });

        renderer.domElement.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            const deltaMove = {
                x: e.clientX - previousMousePosition.x,
                y: e.clientY - previousMousePosition.y
            };

            // Rotate camera around Y-axis (left/right) and X-axis (up/down)
            const offset = new THREE.Vector3();
            offset.copy(camera.position).sub(scene.position); // vector from scene center to camera

            const spherical = new THREE.Spherical();
            spherical.setFromVector3(offset);

            spherical.theta -= deltaMove.x * rotationSpeed; // horizontal
            spherical.phi -= deltaMove.y * rotationSpeed; // vertical
            spherical.phi = Math.max(0.01, Math.min(Math.PI - 0.01, spherical.phi)); // avoid flipping

            offset.setFromSpherical(spherical);
            camera.position.copy(scene.position).add(offset);
            camera.lookAt(scene.position);

            previousMousePosition = {x: e.clientX, y: e.clientY};
        });

        function drawFrame() {
            renderer.render(scene, camera);
        }

        renderer.setAnimationLoop(drawFrame);
    }
