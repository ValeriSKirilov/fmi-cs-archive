# Вдига базата през Docker - без локална инсталация на PostgreSQL.
# Локално са нужни само Docker, Python (лек клиент) и Ollama.
#
#   docker compose up -d
#   ollama pull bge-m3                  # Ollama е локален, не в Docker
#
# Спиране: docker compose down   (с -v изтрива и данните)

services:
  pgvector:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vectors
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql   # таблица + HNSW индекс при старт

volumes:
  pg_data:
